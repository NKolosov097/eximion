services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: eximion
      POSTGRES_USER: eximion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eximion-local-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eximion -d eximion"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://eximion:${POSTGRES_PASSWORD:-eximion-local-only}@db:5432/eximion
      AUTHOR_API_KEY: ${AUTHOR_API_KEY:-local-author-key}
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-eximion-511003}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-europe-west3}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      PORT: "8080"
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_INTERNAL_URL: http://backend:8080
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
volumes:
  postgres-data:
