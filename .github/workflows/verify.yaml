name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typechecks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.4'
          save-cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      - run: uv run --project backend mypy --config-file backend/pyproject.toml backend/app
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.4'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --frozen
      - run: uv run --project backend python -m pytest backend/tests -m "not integration"
      - run: uv run --project backend python -m unittest discover -s scripts -p "test_*.py"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  integration-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: eximion
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: eximion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eximion -d eximion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://eximion:ci-only-password@127.0.0.1:5432/eximion_test
      DATABASE_URL: postgresql+psycopg://eximion:ci-only-password@127.0.0.1:5432/eximion_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.4'
          save-cache: false
      - run: uv sync --project backend --frozen
      - run: uv run --project backend python -m pytest backend/tests -m integration
  api-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.4'
          save-cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
      - run: uv sync --project backend --frozen
      - run: npm ci
        working-directory: frontend
      - run: uv run --project backend python scripts/generate-contract.py
      - run: git diff --exit-code -- docs/openapi.json frontend/src/lib/api.generated.ts
  builds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet
      - run: docker build -t eximion-backend backend
      - run: docker build -t eximion-frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 frontend
  browser-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
  verify:
    if: always()
    needs: [typechecks, unit-tests, integration-tests, api-contract, builds, browser-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success,success,success"
