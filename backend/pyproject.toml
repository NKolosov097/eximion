[project]
name = "eximion-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.4",
    "google-auth==2.61.0",
    "google-genai==2.29.0",
    "grpcio==1.84.0",
    "httpx==0.28.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "sqlalchemy==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
